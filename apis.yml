description: 'Midas (Midas Technologies / Midas Inc.) is a free consumer cash-rewards
  and loyalty app in Mexico, built around the slogan "Tu efectivo cuenta" (your cash
  counts). Shoppers earn points worth up to 5% back when paying at affiliated merchants,
  where one Midas point equals one Mexican peso and accumulated points can be spent
  to pay the full total of a bill at participating stores. The app lets users create
  an account in under three minutes with just a name and phone number, view their
  points balance, browse promotions and discounts, find nearby affiliated stores on
  an interactive map, and track a full history of transactions and purchase tickets.
  Merchants can affiliate their business ("Afilia tu negocio") to reward customers.
  The company is a consumer-facing mobile app and publishes no public developer API,
  SDK, or API documentation. It was surfaced as a 500 Global portfolio company and
  added to the API Evangelist network for enrichment.'
